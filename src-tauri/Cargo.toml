[package]
name = "dactylo"
description = "Dactylo — entraînement à la frappe et à l'orthographe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "dactylo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
dactylo-core = { workspace = true, features = ["specta"] }
tauri = { version = "2.12.5", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
specta.workspace = true
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta-typescript = "=0.0.13"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.29.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
