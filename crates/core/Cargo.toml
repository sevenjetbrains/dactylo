[package]
name = "dactylo-core"
description = "Cœur métier de Dactylo : Rust pur, sans dépendance à Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Dérive specta::Type sur les types exposés à l'interface (activé par src-tauri).
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"


[lints]
workspace = true
