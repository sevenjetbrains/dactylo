[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.90"

[workspace.dependencies]
dactylo-core = { path = "crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# tauri-specta rc.26 exige cette version exacte de specta (voir ADR 0001).
specta = { version = "=2.0.0-rc.26", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
